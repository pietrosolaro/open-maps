<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Anillo de Picos</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css"/>

<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  body{font-family:Georgia,serif;background:#1a1c18;color:#e8e4d9;height:100vh;display:flex;flex-direction:column;overflow:hidden;}
  header{padding:12px 20px 10px;background:#1a1c18;border-bottom:1px solid #2e3028;display:flex;align-items:baseline;gap:16px;flex-shrink:0;flex-wrap:wrap;}
  header h1{font-size:1.25rem;font-weight:normal;letter-spacing:.04em;}
  header span{font-size:.78rem;color:#7a7d6e;font-family:"Courier New",monospace;letter-spacing:.06em;text-transform:uppercase;}
  #map{flex:1;width:100%;background:#dfe0d8;}
  .panel{background:rgba(22,24,18,.95);border:1px solid #2e3028;border-radius:2px;font-family:"Courier New",monospace;max-width:265px;overflow:hidden;}
  .panel-head{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:9px 12px;cursor:pointer;user-select:none;}
  .panel-head:hover{background:rgba(46,48,40,.4);}
  .panel-title{font-size:.68rem;text-transform:uppercase;letter-spacing:.1em;color:#7a7d6e;}
  .panel-toggle{font-size:.9rem;color:#8a9e6a;transition:transform .2s;}
  .panel.collapsed .panel-toggle{transform:rotate(-90deg);}
  .panel-body{padding:0 12px 12px;max-height:70vh;overflow-y:auto;transition:max-height .25s,opacity .2s,padding .25s;}
  .panel.collapsed .panel-body{max-height:0;opacity:0;padding-top:0;padding-bottom:0;}
  .legend-item{display:flex;align-items:center;gap:9px;margin-bottom:7px;cursor:pointer;transition:opacity .15s;}
  .legend-item:hover{opacity:.75;}
  .legend-item.faded{opacity:.3;}
  .legend-swatch{width:28px;height:4px;border-radius:2px;flex-shrink:0;}
  .legend-marker{width:16px;text-align:center;flex-shrink:0;font-size:.85rem;}
  .legend-label{color:#c8c4b4;font-size:.68rem;line-height:1.3;}
  .legend-label b{display:block;color:#e8e4d9;}
  .legend-count{color:#7a7d6e;font-size:.6rem;}
  .legend-sub{margin-top:12px;padding-top:9px;border-top:1px solid #2e3028;}
  .legend-subtitle{font-size:.6rem;text-transform:uppercase;letter-spacing:.08em;color:#7a7d6e;margin-bottom:8px;}
  .legend-foot{margin-top:10px;color:#5a5d4e;font-size:.6rem;border-top:1px solid #2e3028;padding-top:8px;line-height:1.4;}
  .mode-btn{display:inline-block;padding:3px 8px;margin-right:4px;margin-bottom:4px;font-size:.62rem;cursor:pointer;border-radius:2px;border:1px solid #2e3028;transition:all .15s;}
  .leaflet-popup-content-wrapper{background:#1e2018;border:1px solid #2e3028;border-radius:3px;color:#e8e4d9;box-shadow:0 4px 24px rgba(0,0,0,.7);}
  .leaflet-popup-tip{background:#1e2018;}
  .leaflet-popup-content{font-family:"Courier New",monospace;font-size:.75rem;margin:0;line-height:1.5;width:290px!important;}
  .pc{padding:12px 14px;}
  .pc-name{font-size:.92rem;font-family:Georgia,serif;}
  .pc-sub{font-size:.66rem;color:#7a7d6e;margin-top:2px;}
  .pc-diff{display:inline-block;margin-top:8px;padding:3px 9px;border-radius:2px;font-size:.68rem;letter-spacing:.05em;text-transform:uppercase;}
  .pc-lastedit{margin-top:10px;padding:8px 10px;background:#242720;border:1px solid #2e3028;border-radius:2px;}
  .pc-lastedit-lbl{font-size:.58rem;text-transform:uppercase;letter-spacing:.08em;color:#7a7d6e;}
  .pc-lastedit-user{font-size:.9rem;color:#8a9e6a;margin-top:2px;}
  .pc-lastedit-date{font-size:.66rem;color:#c8c4b4;}
  .pc-tbl-title{font-size:.6rem;text-transform:uppercase;letter-spacing:.08em;color:#7a7d6e;margin:12px 0 4px;display:flex;justify-content:space-between;}
  table.contrib{width:100%;border-collapse:collapse;font-size:.66rem;}
  table.contrib th{text-align:left;color:#7a7d6e;font-weight:normal;padding:3px 4px;border-bottom:1px solid #2e3028;font-size:.58rem;text-transform:uppercase;position:sticky;top:0;background:#1e2018;}
  table.contrib td{padding:4px;border-bottom:1px solid #26281f;vertical-align:top;}
  table.contrib tr:last-child td{border-bottom:none;}
  .row-latest{background:#26291f;}
  .row-latest td:first-child{border-left:2px solid #8a9e6a;}
  .cd-date{color:#c8c4b4;white-space:nowrap;}
  .cd-user{color:#e8e4d9;}
  .youtag{color:#8a9e6a;font-size:.56rem;}
  .w-set{color:#6abf4b;}.w-chg{color:#e8922a;}.w-oth{color:#5a5d4e;}
  .tbl-scroll{max-height:180px;overflow-y:auto;border:1px solid #2e3028;border-radius:2px;}
  .pc-warn{color:#e8922a;font-size:.64rem;margin-top:8px;}
  .pc-good{color:#6abf4b;font-size:.64rem;margin-top:8px;}
  .hut-icon{font-size:18px;text-align:center;filter:drop-shadow(0 1px 2px rgba(0,0,0,.6));}
  .peak-label{font-family:"Courier New",monospace;font-size:9px;color:#3a2e20;font-weight:bold;text-shadow:0 0 3px #fff,0 0 3px #fff,0 0 3px #fff;white-space:nowrap;}
  .toast{position:absolute;bottom:30px;left:50%;transform:translateX(-50%);background:rgba(22,24,18,.92);border:1px solid #2e3028;padding:6px 14px;font-family:"Courier New",monospace;font-size:.72rem;color:#7a7d6e;border-radius:2px;pointer-events:none;z-index:1000;white-space:nowrap;}
</style>
</head>

  for(let i=h.length-1;i>=0;i--){
    const e=h[i];
    let what,cls;
    if(e[3]===2){what='set '+sacShort(e[2]);cls='w-set';}
    else if(e[3]===1){what='&#8594; '+sacShort(e[2]);cls='w-chg';}
    else{what='other edit';cls='w-oth';}
    const lt=i===h.length-1?' row-latest':'';
    rows+='<tr class="'+lt+'"><td class="cd-date">'+e[0]+'</td><td class="cd-user">'+e[1]+(lt?' <span class="youtag">&#9664;last</span>':'')+'</td><td class="'+cls+'">'+what+'</td></tr>';
  }
  const table='<div class="tbl-scroll"><table class="contrib"><thead><tr><th>Date</th><th>Contributor</th><th>Change</th></tr></thead><tbody>'+rows+'</tbody></table></div>';
  return '<div class="pc"><div class="pc-name">'+name+'</div><div class="pc-sub">SAC '+sacShort(w.s)+(w.sf?' &middot; '+w.sf:'')+'</div>'+
    '<div class="pc-diff" style="background:'+info.color+'22;color:'+info.color+';border:1px solid '+info.color+'55">'+info.label+'</div>'+
    warn+lastBlk+
    '<div class="pc-tbl-title"><span>All contributions</span><span>'+h.length+' edits &middot; '+w.uc+' people</span></div>'+table+'</div>';
}

const BOUNDS=[[43.15,-5.00],[43.27,-4.75]];
const map=L.map('map',{zoomControl:true,preferCanvas:true,minZoom:10,maxZoom:17});
map.fitBounds(BOUNDS);

// Base layers. Esri World Topo loads reliably in sandboxed iframes and shows terrain,
// peaks and place names. OpenTopoMap kept as an option but it often blocks in iframes.
const esriTopo=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Topo_Map/MapServer/tile/{z}/{y}/{x}',{maxZoom:17,attribution:'Tiles &copy; Esri | &copy; OpenStreetMap contributors'});
const esriImagery=L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',{maxZoom:17,attribution:'Tiles &copy; Esri'});
const openTopo=L.tileLayer('https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',{maxZoom:17,attribution:'&copy; OpenTopoMap | &copy; OpenStreetMap contributors'});
const osmStd=L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'});
esriTopo.addTo(map);
L.control.layers({'Topographic (Esri)':esriTopo,'Satellite (Esri)':esriImagery,'OpenTopoMap':openTopo,'OSM Standard':osmStd},null,{position:'topright',collapsed:true}).addTo(map);
map.setMaxBounds(L.latLngBounds(BOUNDS).pad(0.3));

const groups={},counts={};
Object.keys(SAC).forEach(k=>{groups[k]=L.layerGroup().addTo(map);counts[k]=0;});
const allLines=[];
TRAILS.forEach(w=>{
  if(!SAC[w.s])return;
  const line=L.polyline(w.c,{color:tColor(w),weight:3,opacity:.9,lineCap:'round',lineJoin:'round'});
  line.bindPopup(popup(w),{maxWidth:310,minWidth:290});
  line._w=w;groups[w.s].addLayer(line);counts[w.s]++;allLines.push(line);
});
function recolor(){allLines.forEach(l=>l.setStyle({color:tColor(l._w)}));}

const peakLayer=L.layerGroup().addTo(map);
PEAKS.forEach(p=>{
  const icon=L.divIcon({className:'',html:'<div style="color:#5a4030;font-size:12px;text-shadow:0 0 2px #fff">&#9650;</div><div class="peak-label">'+p[2]+' '+p[3]+'</div>',iconSize:[0,0],iconAnchor:[6,6]});
  L.marker([p[0],p[1]],{icon:icon,interactive:false}).addTo(peakLayer);
});
const hutLayer=L.layerGroup().addTo(map);
HUTS.forEach(h=>{
  const icon=L.divIcon({className:'',html:'<div class="hut-icon">&#127976;</div>',iconSize:[22,22],iconAnchor:[11,11]});
  L.marker([h[0],h[1]],{icon:icon}).bindPopup('<div class="pc"><div class="pc-name">&#127968; '+h[2]+'</div><div class="pc-sub">elevation '+h[3]+' m</div><div class="pc-warn">Call the guardian before you go — confirm route &amp; snow conditions.</div></div>').bindTooltip(h[2],{direction:'top',offset:[0,-10],className:'peak-label'}).addTo(hutLayer);
});

const total=Object.values(counts).reduce((a,b)=>a+b,0);
const toast=document.createElement('div');toast.className='toast';toast.textContent=total+' trails · '+HUTS.length+' refugios · '+PEAKS.length+' peaks';
document.getElementById('map').appendChild(toast);setTimeout(()=>toast.remove(),4000);

const legend=L.control({position:'bottomright'});
legend.onAdd=function(){
  const div=L.DomUtil.create('div','panel');
  L.DomEvent.disableClickPropagation(div);L.DomEvent.disableScrollPropagation(div);
  const head=document.createElement('div');head.className='panel-head';
  head.innerHTML='<span class="panel-title">Legend</span><span class="panel-toggle">&#9660;</span>';
  div.appendChild(head);
  const body=document.createElement('div');body.className='panel-body';
  const mw=document.createElement('div');mw.style.marginBottom='10px';
  mw.innerHTML='<div class="legend-subtitle">Colour trails by</div>';
  const modes=[['sac','Difficulty'],['conf','Confidence'],['fresh','Freshness']];
  const btns={};const scaleBox=document.createElement('div');
  function buildScale(){
    scaleBox.innerHTML='';
    if(mode==='sac'){
      Object.entries(SAC).forEach(function(e){
        const key=e[0],info=e[1];
        const it=document.createElement('div');it.className='legend-item';
        it.innerHTML='<div class="legend-swatch" style="background:'+info.color+'"></div><div class="legend-label"><b>'+info.label+' <span class="legend-count">('+counts[key]+')</span></b>'+info.desc+'</div>';
        it.addEventListener('click',function(){if(map.hasLayer(groups[key])){map.removeLayer(groups[key]);it.classList.add('faded');}else{map.addLayer(groups[key]);it.classList.remove('faded');}});
        scaleBox.appendChild(it);
      });
    }else if(mode==='conf'){
      [['#6abf4b','High','4+ contributors'],['#d4c445','Medium','2-3 contributors'],['#d94f3a','Low','1 contributor only']].forEach(function(b){
        const it=document.createElement('div');it.className='legend-item';
        it.innerHTML='<div class="legend-swatch" style="background:'+b[0]+'"></div><div class="legend-label"><b>'+b[1]+'</b>'+b[2]+'</div>';scaleBox.appendChild(it);});
      const n=document.createElement('div');n.style.cssText='font-size:.6rem;color:#7a7d6e;margin-top:4px';n.textContent='Tap a trail for the full contribution table.';scaleBox.appendChild(n);
    }else{
      [['#6abf4b','Fresh','< 2 years'],['#d4c445','Aging','2-5 years'],['#d94f3a','Stale','> 5 years']].forEach(function(b){
        const it=document.createElement('div');it.className='legend-item';
        it.innerHTML='<div class="legend-swatch" style="background:'+b[0]+'"></div><div class="legend-label"><b>'+b[1]+'</b>'+b[2]+'</div>';scaleBox.appendChild(it);});
    }
  }
  function refresh(){modes.forEach(function(m){const on=mode===m[0];btns[m[0]].style.background=on?'#8a9e6a':'transparent';btns[m[0]].style.color=on?'#1a1c18':'#c8c4b4';});buildScale();}
  modes.forEach(function(m){const b=document.createElement('span');b.className='mode-btn';b.textContent=m[1];b.onclick=()=>{mode=m[0];recolor();refresh();};btns[m[0]]=b;mw.appendChild(b);});
  body.appendChild(mw);body.appendChild(scaleBox);refresh();
  const sub=document.createElement('div');sub.className='legend-sub';
  const hi=document.createElement('div');hi.className='legend-item';
  hi.innerHTML='<div class="legend-marker">&#127976;</div><div class="legend-label"><b>Refugios <span class="legend-count">('+HUTS.length+')</span></b>Staffed refuges</div>';
  hi.addEventListener('click',function(){if(map.hasLayer(hutLayer)){map.removeLayer(hutLayer);hi.classList.add('faded');}else{map.addLayer(hutLayer);hi.classList.remove('faded');}});
  sub.appendChild(hi);
  const pi=document.createElement('div');pi.className='legend-item';
  pi.innerHTML='<div class="legend-marker">&#9650;</div><div class="legend-label"><b>Peaks <span class="legend-count">('+PEAKS.length+')</span></b>Summits &gt;2400 m</div>';
  pi.addEventListener('click',function(){if(map.hasLayer(peakLayer)){map.removeLayer(peakLayer);pi.classList.add('faded');}else{map.addLayer(peakLayer);pi.classList.remove('faded');}});
  sub.appendChild(pi);body.appendChild(sub);
  const foot=document.createElement('div');foot.className='legend-foot';
  foot.innerHTML='Tap any trail for its full edit table — every contributor, newest first, last editor highlighted. OSM data; confirm conditions with refugio guardians.';
  body.appendChild(foot);div.appendChild(body);
  head.addEventListener('click',function(){div.classList.toggle('collapsed');});
  return div;
};
legend.addTo(map);
</script>
</body>
</html>
